# Intentional differences from a recorded engine-version, keyed by the live
# engine (stannum.yaml) and the recorded engine-version each entry is against.
# An entry must document its difference: the expected payload pins what the
# engine knowingly answers differently (design 4.2 / 7).

divergences:
- id: catalog.gucs
  against: stannum-0.4.0
  kind: gap
  captures:
  - settings
  summary: 'STN3/0.5.0 exposes twelve engine GUCs that 0.4.0 never registered.
    E.2 classified each against the live define_*_guc registration (name, type,
    default, min/max, context). All twelve match expected.extra field for field;
    none is accidental catalog drift. Eight are the deliberate 0.5.0 production
    surface: count_fold, deferred_merge_docs, max_expansion_terms, read_cache_mb,
    reader_cache_mb, reclaim_pages, warmup_chunks, warmup_min_matches. Four are
    a deliberate diagnostic/measurement surface that ships with 0.5.0:
    profile_count_selection, count_page_threshold, force_count_pages
    (experimental count-strategy controls; they do not change a correct count)
    and debug_seed_score (SUSET; can change ranked results). Design 4.1: a newly
    exposed GUC inherits no 0.4.0 meaning. The nine frozen GUCs match the
    recording field for field. stannum.wal_rmgr_id stays unregistered without
    shared_preload_libraries (wal_rmgr_guc_absent: true).'
  expected:
    settings:
      extra:
      - - stannum.count_fold
        - 'on'
        - 'on'
        - null
        - null
        - bool
        - user
        - null
      - - stannum.count_page_threshold
        - '0'
        - '0'
        - '0'
        - '2147483647'
        - integer
        - user
        - null
      - - stannum.debug_seed_score
        - '-1'
        - '-1'
        - '-1'
        - '1.79769e+308'
        - real
        - superuser
        - null
      - - stannum.deferred_merge_docs
        - '262144'
        - '262144'
        - '0'
        - '2147483647'
        - integer
        - user
        - null
      - - stannum.force_count_pages
        - 'off'
        - 'off'
        - null
        - null
        - bool
        - user
        - null
      - - stannum.max_expansion_terms
        - '65536'
        - '65536'
        - '1'
        - '2147483647'
        - integer
        - user
        - null
      - - stannum.profile_count_selection
        - 'off'
        - 'off'
        - null
        - null
        - bool
        - user
        - null
      - - stannum.read_cache_mb
        - '64'
        - '64'
        - '1'
        - '1048576'
        - integer
        - user
        - null
      - - stannum.reader_cache_mb
        - '384'
        - '384'
        - '1'
        - '1048576'
        - integer
