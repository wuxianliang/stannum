name: CI

on:
  push:
  pull_request:
  # Monthly dry-run of live planetscale/lead into the stn3 tip. Existing jobs
  # must not run on this event (see job-level if: below).
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      job:
        description: >
          ci = lint, build-and-test, and reference-oracle (today's push/PR
          set). upstream-dry-run = merge live Lead and replay the
          single-column contract subset only.
        type: choice
        options:
          - ci
          - upstream-dry-run
        default: ci
      upstream_ref:
        description: PlanetScale Lead git ref to merge (branch, tag, or SHA). Ignored unless job is upstream-dry-run.
        type: string
        default: main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PGRX_VERSION: 0.19.1

jobs:
  # Formatting and the pure-Python harness need no PostgreSQL; fail fast here.
  # Test steps go through script/test-all, so CI, the local gates and
  # docs/testing.md name the same commands.
  lint:
    name: Format and harness tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.job == 'ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Source attribution
        run: script/test-all headers
      - name: Check formatting
        run: script/test-all fmt
      - name: Benchmark harness and cluster test unit tests
        run: script/test-all python-unit
      - name: Published benchmark query adapter
        run: |
          python3 benchmarks/tin.py --driver "$RUNNER_TEMP/stannum-benchmark-driver" prepare
          BENCHMARK_DRIVER="$RUNNER_TEMP/stannum-benchmark-driver" node --test \
            benchmarks/tin/adapter.test.mjs \
            "$RUNNER_TEMP/stannum-benchmark-driver/benchmarks/queries.test.js"

  # Both architectures matter: `c_char` is signed on x86-64 and unsigned on
  # AArch64, and both PostgreSQL majors have caught API differences.
  build-and-test:
    name: ${{ matrix.arch.name }} / PostgreSQL ${{ matrix.postgres }}
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.job == 'ci')
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86-64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
        postgres: [17, 18]
    env:
      PG_MAJOR: ${{ matrix.postgres }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # PGDG packages instead of building PostgreSQL from source: the same
      # server binaries users install, and minutes instead of tens of minutes.
      - name: Install PostgreSQL ${{ matrix.postgres }} from PGDG
        run: |
          sudo apt-get install --yes --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends \
            "postgresql-${PG_MAJOR}" "postgresql-server-dev-${PG_MAJOR}" \
            libclang-dev pkg-config libssl-dev python3-psycopg python3-yaml
          sudo systemctl stop postgresql || true
          # pgrx installs the extension into the server's own directories.
          sudo chown -R "$USER" "/usr/lib/postgresql/${PG_MAJOR}" "/usr/share/postgresql/${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain and Clippy
        run: rustup component add clippy

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: pg${{ matrix.postgres }}

      - name: Cache cargo-pgrx
        id: pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-pgrx
        if: steps.pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked

      - name: Point pgrx at the installed server
        run: |
          echo "PGRX_HOME=$RUNNER_TEMP/pgrx" >> "$GITHUB_ENV"
          PGRX_HOME="$RUNNER_TEMP/pgrx" cargo pgrx init "--pg${PG_MAJOR}=/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config"

      - name: Build
        run: cargo build --locked --package stannum --no-default-features --features "pg${PG_MAJOR}"

      - name: Clippy
        run: script/test-all clippy

      - name: Library crate tests
        run: script/test-all rust-unit

      # pg_tests and the extension's #[test]s, then, on the pg_test build
      # that leaves installed and each in a private cluster: crashes injected
      # between page writes and meta-page publication
      # (postgres/tests/crash_before_publication.py) and a count racing VACUUM
      # (postgres/tests/count_under_vacuum.py).
      - name: Extension tests and race-point checks
        run: script/test-all pgrx

      - name: Install release build
        run: script/test-all install

      # Each in a throwaway cluster: release schema and upgrade compatibility;
      # crash recovery, VACUUM, folds, merges, standby fallback and backend
      # reuse; deferred-merge crashes; the ranked-scan concurrency fuzz smoke
      # (fixed seeds plus the regression list, under two minutes); VACUUM
      # with pinned heap pages; the benchmark writers' target selection.
      - name: Cluster tests
        run: script/test-all cluster

      # Every conformance case against TIN 1.0.3's recorded answers, in a
      # throwaway cluster. The answers were recorded on PostgreSQL 18.
      - name: Conformance against TIN 1.0.3
        if: matrix.postgres == 18
        run: script/test-all conformance

      - name: VACUUM workload harness smoke
        run: |
          smoke_dir="$RUNNER_TEMP/vacuum-workload-smoke"
          mkdir -p "$smoke_dir"
          installed_library="$(pg_config --pkglibdir)/stannum.so"
          cp "$installed_library" "$smoke_dir/candidate.so"
          python3 benchmarks/paired_libraries.py \
            --baseline "$smoke_dir/candidate.so" --integrated "$smoke_dir/candidate.so" \
            --installed-library "$installed_library" --checkpoint-control \
            --workload vacuum --scenario mixed --docs 32768 --repeat 20 --rounds 1 \
            --baseline-vacuum-strategy direct --integrated-vacuum-strategy reconstruct \
            --query-shapes mixed --reader-rate 200 --reader-seconds 4 \
            --output "$smoke_dir/results"

      - name: Retain VACUUM harness smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacuum-smoke-${{ matrix.arch.name }}-pg${{ matrix.postgres }}
          path: ${{ runner.temp }}/vacuum-workload-smoke/results
          if-no-files-found: ignore
          retention-days: 7

      - name: Sustained mixed-write harness smoke
        run: |
          python3 benchmarks/sustained.py \
            --artifact "$(pg_config --pkglibdir)/stannum.so" \
            --output "$RUNNER_TEMP/sustained-smoke" \
            --engines stannum,gin,gin-no-fastupdate --profile mutation-count \
            --rows 10000 --seconds 20 --warmup 1 --rounds 1 \
            --write-rates 200 --writer-counts 2 --read-rate 100 \
            --vacuum-interval 5 --check-interval 5

      - name: Retain sustained mixed-write smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustained-smoke-${{ matrix.arch.name }}-pg${{ matrix.postgres }}
          path: ${{ runner.temp }}/sustained-smoke
          if-no-files-found: ignore
          retention-days: 7

  # Behavioral regression suite: the same fixture, 47 query shapes and five
  # mutation states on Stannum and on the original Lead, checked out directly
  # from PlanetScale's repository and built under its own name `tin`. Match
  # sets and rank order must agree; Lead's score bits are not compared (see
  # docs/compatibility.md#reference-oracle-against-lead for the two known deviations).
  reference-oracle:
    name: Reference oracle against upstream Lead
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.job == 'ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PG_MAJOR: 18
      LEAD_REPOSITORY: planetscale/lead
      LEAD_REF: main
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check out upstream Lead
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.LEAD_REPOSITORY }}
          ref: ${{ env.LEAD_REF }}
          path: lead-ref
      - name: Install PostgreSQL ${{ env.PG_MAJOR }} from PGDG
        run: |
          sudo apt-get install --yes --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends \
            "postgresql-${PG_MAJOR}" "postgresql-server-dev-${PG_MAJOR}" libclang-dev pkg-config libssl-dev
          sudo systemctl stop postgresql || true
          sudo chown -R "$USER" "/usr/lib/postgresql/${PG_MAJOR}" "/usr/share/postgresql/${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: pg${{ env.PG_MAJOR }}-reference
          workspaces: |
            . -> target
            lead-ref -> target
      - name: Cache cargo-pgrx
        id: pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-pgrx
        if: steps.pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
      - name: Point pgrx at the installed server
        run: |
          echo "PGRX_HOME=$RUNNER_TEMP/pgrx" >> "$GITHUB_ENV"
          PGRX_HOME="$RUNNER_TEMP/pgrx" cargo pgrx init "--pg${PG_MAJOR}=/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config"
      - name: Start a throwaway cluster
        run: |
          initdb -D "$RUNNER_TEMP/oracle-data" -U "$USER" -A trust --no-locale --encoding=UTF8
          # Debian builds default the socket directory to /var/run/postgresql,
          # which the runner user cannot write.
          pg_ctl -D "$RUNNER_TEMP/oracle-data" \
            -o "-p 28999 -c listen_addresses=localhost -c unix_socket_directories=$RUNNER_TEMP" \
            -l "$RUNNER_TEMP/oracle.log" -w start || { cat "$RUNNER_TEMP/oracle.log"; exit 1; }
      - name: Build both extensions and run the oracle
        env:
          PGHOST: localhost
          PGPORT: 28999
          LEAD_REF_DIR: ${{ github.workspace }}/lead-ref
        run: script/reference-oracle "$RUNNER_TEMP/reference-oracle"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-oracle
          path: ${{ runner.temp }}/reference-oracle
          if-no-files-found: ignore

  # Design §9 / §7: upstream merges are gated by the contract suite, including
  # a dry-run of live planetscale/lead (not the old pin d57ef58). Conflicts in
  # §3 shim files are expected: this job must go red on conflict with a
  # distinct report, not look like a later compile or contract failure.
  # Never on push/PR; schedule + dedicated workflow_dispatch only.
  upstream-dry-run:
    name: Upstream Lead dry-run (PostgreSQL 18)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job == 'upstream-dry-run')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PG_MAJOR: "18"
      LEAD_REPOSITORY: planetscale/lead
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: "UPSTREAM DRY-RUN: test-merge live Lead"
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git config user.email "ci@stannum.invalid"
          git config user.name "stannum-ci"
          git checkout -B upstream-dry-run-scratch HEAD
          git fetch --no-tags "https://github.com/${LEAD_REPOSITORY}.git" "$UPSTREAM_REF"
          ours=$(git rev-parse HEAD)
          theirs=$(git rev-parse FETCH_HEAD)
          echo "Ours     $ours ($(git log -1 --oneline HEAD))"
          echo "Upstream $theirs ($LEAD_REPOSITORY $UPSTREAM_REF)"
          echo "UPSTREAM DRY-RUN: merging $LEAD_REPOSITORY@$UPSTREAM_REF ($theirs) into $ours"
          if git merge --no-commit --no-ff FETCH_HEAD; then
            echo "UPSTREAM DRY-RUN: MERGE CLEAN"
            echo "UPSTREAM DRY-RUN: MERGE CLEAN" >> "$GITHUB_STEP_SUMMARY"
            echo "Merged $LEAD_REPOSITORY@$UPSTREAM_REF ($theirs) into $ours with no conflicts." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          conflicts=$(git diff --name-only --diff-filter=U)
          if [ -z "$conflicts" ]; then
            echo "UPSTREAM DRY-RUN: MERGE FAILED"
            git status --short
            echo "::error::UPSTREAM DRY-RUN: MERGE FAILED (no unmerged paths)"
            exit 1
          fi
          echo "============================================================"
          echo "UPSTREAM DRY-RUN: MERGE CONFLICT"
          echo "============================================================"
          echo "Conflicting paths:"
          echo "$conflicts"
          echo
          git status --short
          {
            echo "## UPSTREAM DRY-RUN: MERGE CONFLICT"
            echo
            echo "Merging \`$LEAD_REPOSITORY@$UPSTREAM_REF\` (\`$theirs\`) into \`$ours\` conflicted."
            echo
            echo "Conflicting paths:"
            echo
            echo '```'
            echo "$conflicts"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::UPSTREAM DRY-RUN: MERGE CONFLICT"
          exit 1

      - name: Install PostgreSQL 18 from PGDG
        run: |
          sudo apt-get install --yes --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends \
            "postgresql-${PG_MAJOR}" "postgresql-server-dev-${PG_MAJOR}" \
            libclang-dev pkg-config libssl-dev python3-venv
          sudo systemctl stop postgresql || true
          sudo chown -R "$USER" "/usr/lib/postgresql/${PG_MAJOR}" "/usr/share/postgresql/${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: upstream-dry-run-pg18

      - name: Cache cargo-pgrx
        id: pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-pgrx
        if: steps.pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked

      - name: Point pgrx at the installed server
        run: |
          echo "PGRX_HOME=$RUNNER_TEMP/pgrx" >> "$GITHUB_ENV"
          PGRX_HOME="$RUNNER_TEMP/pgrx" cargo pgrx init "--pg${PG_MAJOR}=/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config"

      - name: Build and install release
        run: cargo pgrx install --release --package stannum --no-default-features --features "pg${PG_MAJOR}"

      - name: Single-column contract subset
        env:
          CONFORMANCE_DSN: host=localhost port=55432 dbname=postgres
        run: |
          initdb -D "$RUNNER_TEMP/contract-data" -U "$USER" -A trust --no-locale --encoding=UTF8
          pg_ctl -D "$RUNNER_TEMP/contract-data" \
            -o "-p 55432 -c listen_addresses=localhost -c unix_socket_directories=$RUNNER_TEMP" \
            -l "$RUNNER_TEMP/contract.log" -w start || { cat "$RUNNER_TEMP/contract.log"; exit 1; }
          psql -h localhost -p 55432 -d postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION stannum;"
          python3 -m venv "$RUNNER_TEMP/contract-venv"
          "$RUNNER_TEMP/contract-venv/bin/pip" install 'psycopg[binary]' pyyaml
          "$RUNNER_TEMP/contract-venv/bin/python" contract/run.py --engine stannum \
            --check contract/expected/stannum-0.4.0 \
            --case 'arithmetic.row3*' \
            --case 'calls.search*' \
            --case calls.search_count \
            --case calls.verify_index \
            --case calls.stop_words \
            --case calls.tokenize_named \
            --case 'stats.*' \
            --case ddl.tin_ignored \
            --case catalog.gucs \
            --case 'capabilities.*' \
            --case tokenizer.unicode_whitespace

